services:
  postgres:
    image: postgres:18.7-bookworm@sha256:e742a2668255221388004f3a42b6150a2103f5054ab3a4a93ae9e4f01e551c35
    environment:
      POSTGRES_USER: zoom_admin
      POSTGRES_DB: zoomlab
      POSTGRES_PASSWORD: ${ZOOM_PG_PASSWORD:?Set ZOOM_PG_PASSWORD in your environment or env file}
    ports:
      - "127.0.0.1:${ZOOM_PG_PORT:-55432}:5432"
    volumes:
      - meeting-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - statement_timeout=3000
      - -c
      - lock_timeout=1000
      - -c
      - idle_in_transaction_session_timeout=2500
      - -c
      - transaction_timeout=6000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 3s
      retries: 40
    labels:
      org.zoomclone.lab: ${COMPOSE_PROJECT_NAME}
volumes:
  meeting-data:
    labels:
      org.zoomclone.lab: ${COMPOSE_PROJECT_NAME}
